# 待适配示例；map 放在 nginx.conf 的 http {} 中，仅定义一次。
map $http_upgrade $echo_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name game.example.com;
    return 301 https://game.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name game.example.com;
    ssl_certificate /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
    root /opt/echo-theatre/dist;
    index index.html;
    client_max_body_size 2m;

    location ^~ /api/nia/ {
        proxy_pass http://127.0.0.1:4179;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $echo_connection_upgrade;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_buffering off;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4178;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
